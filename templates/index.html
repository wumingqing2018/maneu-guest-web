{% extends 'base.html' %}
{% load static %}
{% block css %}
    <link href="{% static 'css/index.css' %}" referrerpolicy="no-referrer" rel="stylesheet"/>
{% endblock %}
{% block content %}
    <body>

    <!-- 科技感背景元素 -->
    <div class="tech-bg"></div>
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>

    <!-- 主要内容 -->
    <div class="main-content">
        <div class="landing-card">
            <!-- 品牌标识 -->
            <div class="logo-container">
                <img src="{% static 'img/maneu/logo.svg' %}" alt="徕可" class="logo-img">
            </div>
            <h1 class="brand-name">徕可</h1>
            <p class="brand-sub">Officially Licensed Products</p>

            <!-- 信任徽章 -->
            <div class="trust-badge">
                <span class="trust-dot"></span>
                官方授权 · 正品保障
            </div>

            <!-- 小程序码区域 -->
            <div class="qr-section">
                <img src="{% static 'img/maneu/code.jpg' %}" alt="小程序码" class="qr-img">
                <p class="qr-hint">微信扫码查看订单</p>
                <p class="qr-sub-hint">快速验证 · 安全可靠</p>
            </div>
        </div>
    </div>

    <!-- 页脚备案 -->
    <footer class="footer">
        <a href="https://beian.miit.gov.cn" target="_blank" rel="noopener">粤ICP备2023070483号</a>
    </footer>

    </body>
{% endblock %}
{% block javascript %}
    <script src="{% static 'javascript/index.js' %}"></script>
{% endblock %}
