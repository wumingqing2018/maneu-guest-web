[uwsgi]

# ==============================================
# 1. 基础路径与项目入口
# ==============================================
chdir = /var/www/maneu-guest
module = maneu.wsgi:application

# ==============================================
# 2. 网络通信（Unix Socket）
# ==============================================
socket = /var/www/maneu-guest/uwsgi.sock
chmod-socket = 660
chown-socket = www-data:www-data

# 【新增】设置 socket 的读写超时，防止长连接挂起
socket-timeout = 30

# 【新增】增加缓冲区大小，适应大请求头（默认 4096 可能不够）
buffer-size = 32768

# ==============================================
# 3. 进程与线程（动态调整）
# ==============================================
master = true

# 【优化】根据实际 CPU 核数动态计算，避免写死。
# 假设服务器有 4 核，建议 processes = 2 * 核数 + 1 = 9。
# 如果核数不同，请按此公式手动调整。
processes = 9

threads = 2

# 【新增】每个 worker 处理完 5000 请求后优雅重启，防止内存泄漏
max-requests = 5000

# 【新增】每个 worker 最大存活时间（秒），超过后重启，进一步防止内存泄漏
max-worker-lifetime = 86400   # 24 小时

# 【新增】当内存占用超过 RSS 限制（MB）时重启 worker，保护系统
reload-on-rss = 1024          # 1GB（根据实际内存调整）

listen = 128

# ==============================================
# 4. 超时与缓冲
# ==============================================
harakiri = 60
harakiri-verbose = true
post-buffering = 8192

# 【新增】限制请求体大小，与 Nginx 的 client_max_body_size 保持一致
limit-post = 78643200         # 75MB

# ==============================================
# 5. 安全与权限
# ==============================================
uid = www-data
gid = www-data
thunder-lock = true
enable-threads = true

# ==============================================
# 6. 日志系统（**关键优化：区分站点日志**）
# ==============================================
# 【优化】日志文件添加站点标识，避免与 admin 混用
daemonize = /var/log/uwsgi/maneu-guest.log
log-maxsize = 50000000        # 50MB 自动轮转
log-date = true

# 进程 PID 文件（独立）
pidfile = /var/www/maneu-guest/uwsgi.pid

vacuum = true


# ==============================================
# 7. 环境变量
# ==============================================
env = DJANGO_SETTINGS_MODULE=maneu.settings

# 如果使用虚拟环境，取消注释并指向正确路径
# home = /path/to/venv
# pythonpath = /path/to/venv/lib/python3.x/site-packages

# ==============================================
# 8. 运维辅助
# ==============================================
# 【新增】进程名中添加站点前缀，便于 ps 识别
procname-prefix = [uwsgi-guest]
auto-procname = true

# 【新增】配置变更时自动重载（配合 touch-reload 文件）
# touch-reload = /var/www/maneu-guest/reload.trigger

# 【优化】优雅重启时的等待时间
reload-mercy = 10
worker-reload-mercy = 10